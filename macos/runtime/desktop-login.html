<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCBOX · 连接沙箱</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0e1715;color:#edf6f1;font:16px/1.65 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,480px);padding:32px;border:1px solid #345144;border-radius:18px;background:#192622}small{color:#b7f1d3;letter-spacing:2px}h1{font-size:26px;margin:12px 0}p{color:#b5c8bd}label{display:block;margin-top:24px}input,button{font:inherit;width:100%;min-height:48px;border-radius:9px;padding:10px 14px}input{background:#0e1715;color:#edf6f1;border:1px solid #6b8978;margin:8px 0 16px}button{background:#b7f1d3;color:#143024;border:0;cursor:pointer;font-weight:650}:focus-visible{outline:3px solid #b7f1d3;outline-offset:3px}.notice{font-size:13px;border-top:1px solid #345144;padding-top:16px}.error{color:#ffb2a5}
</style></head><body><main><small>CCBOX / 局域网工作台</small><h1>连接你的沙箱</h1>
<p>在运行 CCBOX 的电脑上，打开「局域网访问 → 查看连接信息」，复制当前空间的访问口令。</p>
<!--ERROR-->
<form action="/login" method="post"><label for="access">访问口令</label><input id="access" name="access" type="password" required maxlength="128" autocomplete="off" spellcheck="false" autofocus><button type="submit">进入沙箱桌面 →</button></form>
<p class="notice">这是桌面访问口令，不是 Claude 账号密码。获得访问权限的人可以操作整个桌面、读取共享项目、使用当前登录账号。本连接使用 HTTP，仅适合可信局域网；不要转发到公网。</p>
</main></body></html>
