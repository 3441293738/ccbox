<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCBOX · 沙箱 VS Code</title>
<style>
:root{color-scheme:dark;--bg:#101716;--card:#1b2525;--line:#354746;--text:#edf4f1;--muted:#adc2ba;--accent:#b6f1d2}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:750;letter-spacing:.08em}.label{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);padding:10px 14px;cursor:pointer;min-height:44px;font:inherit;touch-action:manipulation}
button:hover{background:#30443c}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.55;cursor:default}.primary{background:var(--accent);color:#132c21}.primary:hover{background:#d2ffe5}
#screen{flex:1;min-height:0;overflow:auto;position:relative}footer{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#status{color:var(--accent)}#reconnect{min-height:30px;padding:4px 12px}dialog{width:min(540px,90vw);border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:24px}dialog::backdrop{background:#0009}
textarea{width:100%;min-height:140px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit}h2{margin-top:0;font-size:19px}p{color:var(--muted);line-height:1.7}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
@media(max-width:800px){header{padding:8px}.label{max-width:160px}.actions{margin-left:0}button{padding:8px 10px}footer{padding:6px 10px}}
.dialog-status{min-height:24px;margin:10px 0 0;font-size:13px;overflow-wrap:anywhere}.dialog-status[data-error="true"]{color:#ffb9a8}
#image-preview{display:block;max-width:100%;max-height:220px;margin:14px auto;border-radius:8px;background:#101716}#image-preview[hidden]{display:none}
#image-paste{min-height:76px}.dialog-actions{flex-wrap:wrap}dialog{max-height:90vh;overflow:auto}label{display:block;margin-bottom:8px}
</style></head><body>
<header><span class="brand">CCBOX</span><span>沙箱 VS Code</span><span class="label" id="label"></span>
<div class="actions"><button id="restore" disabled aria-describedby="restore-help" title="找回当前沙箱里已最小化或被遮住的 VS Code 窗口">恢复 VS Code</button><button id="claude" disabled title="在沙箱中按 F9 打开 Claude 面板">Claude 面板</button><button id="clipboard" disabled>发送文字</button><button id="image" disabled title="选择或粘贴一张图片写入沙箱剪贴板">发送图片</button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden aria-label="选择要发送到沙箱的图片"><button id="scale" aria-pressed="true">适应窗口</button><button id="fullscreen" class="primary">全屏工作</button></div></header>
<main id="screen" aria-label="沙箱远程桌面"></main>
<footer><span id="status" role="status" aria-live="polite">正在连接沙箱桌面…</span><button id="reconnect" hidden>重新连接</button><span id="restore-help">最小化后点「恢复 VS Code」；已关闭则回 CCBOX 点「打开 / 恢复 VS Code」。关闭此页不会停止环境。</span></footer>
<dialog id="clip" aria-labelledby="text-title"><h2 id="text-title">发送文字到沙箱</h2>
<p>先粘贴文字，再确认发送。支持中文、多行和特殊符号；只写入沙箱剪贴板，不会执行文字中的命令。</p>
<label for="text">待发送文字</label><textarea id="text" placeholder="在此粘贴文字" aria-describedby="text-status"></textarea>
<p id="text-status" class="dialog-status" role="status" aria-live="polite">发送后，在沙箱的输入框中按 Ctrl+V 粘贴。</p>
<div class="dialog-actions"><button id="cancel">取消</button><button id="send" class="primary" disabled>发送到沙箱剪贴板</button></div></dialog>
<dialog id="image-dialog" aria-labelledby="image-title"><h2 id="image-title">发送图片到沙箱</h2>
<p>粘贴截图或选择图片，预览确认后再发送。每次一张，最大 12 MB；长边超过 4096 像素会等比缩小。</p>
<label for="image-paste">在这里粘贴图片（Windows：Ctrl+V · Mac：⌘V）</label>
<textarea id="image-paste" placeholder="点击这里，再粘贴截图；也可以选择图片文件" aria-describedby="image-status"></textarea>
<button id="image-choose">选择图片文件</button><img id="image-preview" alt="待发送图片预览" hidden>
<p id="image-status" class="dialog-status" role="status" aria-live="polite">尚未选择图片。宿主剪贴板不会被自动读取或同步。</p>
<div class="dialog-actions"><button id="image-cancel">取消</button><button id="image-send" class="primary" disabled>发送到沙箱剪贴板</button></div></dialog>
<script type="module">
import RFB from './core/rfb.js';
const $=id=>document.getElementById(id), label=new URLSearchParams(location.search).get('environment')||'当前环境';
$('label').textContent=label; document.title='CCBOX · 沙箱 VS Code · '+label;
let rfb,fit=true,connected=false,restoring=false,clipboardBusy=false,imageBusy=false,imageBlob=null,previewURL='',imageGeneration=0;
function controls(){
 $('restore').disabled=!connected||restoring;$('claude').disabled=!connected;
 $('clipboard').disabled=!connected||clipboardBusy;$('image').disabled=!connected||clipboardBusy;
 $('send').disabled=!connected||clipboardBusy||!$('text').value.length;
 $('image-send').disabled=!connected||clipboardBusy||imageBusy||!imageBlob;
 $('text').readOnly=clipboardBusy;$('image-paste').readOnly=clipboardBusy;
 for(const id of ['cancel','image-cancel','image-choose'])$(id).disabled=clipboardBusy;
}
function state(text,failed=false){$('status').textContent=text;$('reconnect').hidden=!failed;}
function connect(){
 connected=false;controls();
 if(rfb){rfb.disconnect();$('screen').replaceChildren();}
 state('正在连接沙箱桌面…');
 try{
  const next=new RFB($('screen'),`${location.protocol==='https:'?'wss':'ws'}://${location.host}/websockify`);rfb=next;
  next.scaleViewport=fit;next.resizeSession=false;next.clipViewport=true;next.background='#101716';
  next.addEventListener('connect',()=>{if(rfb!==next)return;connected=true;controls();state('桌面已连接');$('reconnect').hidden=true;next.focus();});
  next.addEventListener('disconnect',()=>{if(rfb!==next)return;connected=false;controls();state('桌面连接已断开；环境可能已停止。',true);});
  next.addEventListener('securityfailure',()=>{if(rfb!==next)return;connected=false;controls();state('桌面认证失败，请从 CCBOX 重新打开。',true);});
 }catch(e){state('桌面连接未成功，请从 CCBOX 重新打开。',true);}
}
$('reconnect').onclick=connect;
$('scale').onclick=()=>{fit=!fit;if(rfb)rfb.scaleViewport=fit;$('scale').setAttribute('aria-pressed',String(fit));$('scale').textContent=fit?'适应窗口':'原始大小';};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();rfb?.focus();}catch(e){state('浏览器未进入全屏，可使用浏览器自己的全屏功能。');}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏工作';});
$('claude').onclick=()=>{rfb?.sendKey(0xffc6,'F9');rfb?.focus();};
$('restore').onclick=async()=>{
 if(!connected||restoring)return;
 const target=rfb,held=[];
 restoring=true;controls();$('restore').setAttribute('aria-busy','true');
 try{
  // Fixed container-only shortcut. Avoid Ctrl+Alt+Fn (X11 VT switching) and
  // Shift+Fn (x11vnc modifier translation). Release every key even on errors.
  for(const key of [[0xffe3,'ControlLeft']]){
   if(!connected||rfb!==target)throw new Error('Disconnected');
   held.push(key);target.sendKey(...key,true);
   await new Promise(resolve=>setTimeout(resolve,60));
  }
  if(!connected||rfb!==target)throw new Error('Disconnected');
  held.push([0xffc5,'F8']);
  target.sendKey(0xffc5,'F8',true);
  await new Promise(resolve=>setTimeout(resolve,80));
  if(connected&&rfb===target)state('已发送恢复请求；若窗口仍未出现，请回 CCBOX 点「打开 / 恢复 VS Code」。');
 }catch(e){if(connected&&rfb===target)state('恢复请求未发送，请重新连接桌面后再试。',true);}
 finally{
  for(const key of held.reverse()){try{target.sendKey(...key,false);}catch(e){}}
  // Leave keyboard focus on the button; don't steal it from keyboard users.
  await new Promise(resolve=>setTimeout(resolve,700));
  restoring=false;$('restore').removeAttribute('aria-busy');controls();
 }
};
function notice(id,message,error=false){$(id).textContent=message;$(id).dataset.error=String(error);}
function openDialog(id,focus){rfb?.blur();$(id).showModal();$(focus).focus();controls();}
function clearImage(){
 imageGeneration++;imageBlob=null;imageBusy=false;
 if(previewURL){URL.revokeObjectURL(previewURL);previewURL='';}
 $('image-preview').hidden=true;$('image-preview').removeAttribute('src');$('image-file').value='';$('image-paste').value='';controls();
}
$('clipboard').onclick=()=>openDialog('clip','text');
$('cancel').onclick=()=>{$('clip').close();};
$('clip').addEventListener('close',()=>{$('text').value='';notice('text-status','发送后，在沙箱的输入框中按 Ctrl+V 粘贴。');controls();$('clipboard').focus();});
$('image-dialog').addEventListener('close',()=>{clearImage();notice('image-status','尚未选择图片。宿主剪贴板不会被自动读取或同步。');$('image').focus();});
for(const id of ['clip','image-dialog'])$(id).addEventListener('cancel',event=>{if(clipboardBusy)event.preventDefault();});
$('text').oninput=controls;
async function uploadClipboard(kind,body){
 if(!connected)throw new Error('桌面已断开，请重新连接后再试。内容已保留。');
 const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),25000);
 try{
  const response=await fetch('/clipboard/'+kind,{method:'POST',credentials:'same-origin',signal:abort.signal,
   headers:{'Content-Type':kind==='text'?'text/plain; charset=utf-8':'image/png'},body});
  if(response.status===403||response.status===404||response.status===502||response.status===503)
   throw new Error('沙箱剪贴板服务尚未就绪。请从 CCBOX 的「检查与修复」运行「准备 / 修复」，完成后重新打开桌面。内容已保留。');
  if(response.status===413)throw new Error('内容过大：文字最多 1 MB，图片最多 12 MB。');
  if(response.status!==204)throw new Error('发送未完成，请检查内容格式后重试。内容已保留。');
 }catch(error){
  if(error.name==='AbortError')throw new Error('发送超时，尚未确认写入。内容已保留，请重试。');
  if(error instanceof TypeError)throw new Error('连接失败，尚未确认写入。内容已保留，请重新连接后重试。');
  throw error;
 }finally{clearTimeout(timer);}
}
$('send').onclick=async()=>{
 if(clipboardBusy)return;const value=$('text').value;
 if(!value)return;
 if(new TextEncoder().encode(value).length>1024*1024){notice('text-status','文字最多 1 MB，请分段发送。',true);return;}
 if(value.includes('\0')){notice('text-status','文字含有空字符，请移除空字符后重试。',true);return;}
 clipboardBusy=true;controls();$('send').setAttribute('aria-busy','true');notice('text-status','正在写入沙箱剪贴板…');
 try{await uploadClipboard('text',value);$('clip').close();state('文字已写入沙箱剪贴板；点击沙箱输入框，再按 Ctrl+V。不会自动提交消息。');}
 catch(error){notice('text-status',error.message,true);}
 finally{clipboardBusy=false;$('send').removeAttribute('aria-busy');controls();}
};
async function imagePng(file){
 if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type))throw new Error('请选择 PNG、JPEG、WebP 或 GIF 图片。');
 if(file.size>12*1024*1024)throw new Error('图片最大 12 MB，请先缩小图片。');
 const url=URL.createObjectURL(file),img=new Image();
 try{
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('图片读取失败，请重新复制截图或选择其他图片。'));img.src=url;});
  const scale=Math.min(1,4096/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('图片转换失败。')),'image/png'));
  if(blob.size>12*1024*1024)throw new Error('转换后的图片超过 12 MB，请先缩小图片。');
  return {blob,width:canvas.width,height:canvas.height};
 }finally{URL.revokeObjectURL(url);}
}
async function stageImage(file){
 if(!file||clipboardBusy)return;clearImage();const generation=imageGeneration;
 imageBusy=true;controls();notice('image-status','正在准备预览…');
 try{
  const converted=await imagePng(file);if(generation!==imageGeneration||!$('image-dialog').open)return;
  imageBlob=converted.blob;previewURL=URL.createObjectURL(imageBlob);$('image-preview').src=previewURL;$('image-preview').hidden=false;
  notice('image-status',`${converted.width} × ${converted.height} · ${(imageBlob.size/1024).toFixed(1)} KB · 仅发送图片内容，不发送文件名或路径。请确认后发送。`);
 }catch(error){if(generation===imageGeneration)notice('image-status',error.message,true);}
 finally{if(generation===imageGeneration){imageBusy=false;controls();}}
}
$('image').onclick=()=>openDialog('image-dialog','image-paste');
$('image-cancel').onclick=()=>{$('image-dialog').close();};
$('image-choose').onclick=()=>{$('image-file').value='';$('image-file').click();};
$('image-file').onchange=()=>stageImage($('image-file').files[0]);
$('image-paste').addEventListener('paste',event=>{
 event.preventDefault();if(clipboardBusy)return;
 const items=[...(event.clipboardData?.items||[])].filter(value=>value.kind==='file'&&value.type.startsWith('image/'));
 if(items.length!==1){notice('image-status','请复制一张截图后粘贴；也可点击「选择图片文件」。',true);return;}
 stageImage(items[0].getAsFile());
});
$('image-send').onclick=async()=>{
 if(!imageBlob||clipboardBusy||imageBusy)return;clipboardBusy=true;controls();$('image-send').setAttribute('aria-busy','true');notice('image-status','正在写入沙箱剪贴板…');
 try{await uploadClipboard('image',imageBlob);$('image-dialog').close();state('图片已写入沙箱剪贴板；点击 Claude 输入框，再按 Ctrl+V 添加附件。不会自动发送给模型。');}
 catch(error){notice('image-status',error.message,true);}
 finally{clipboardBusy=false;$('image-send').removeAttribute('aria-busy');controls();}
};
// Deliberately no navigator.clipboard, host browser fingerprints, storage sync,
// automatic RFB clipboard copying, external telemetry, or external asset URLs.
connect();
</script></body></html>
