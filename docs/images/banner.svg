<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">CCBOX — 选好账号和项目，开始开发</title>
  <desc id="desc">Windows 与 M 系列 Mac 工作区工具。独立空间、共享项目、沙箱开发，以及可选本机工具链。</desc>
  <rect width="1280" height="380" rx="24" fill="#0e1715"/>
  <rect x="1" y="1" width="1278" height="378" rx="23" fill="none" stroke="#2b4239" stroke-width="2"/>
  <g fill="none" stroke="#b7f1d3" stroke-width="2.5" stroke-linejoin="round">
    <path d="M56 55 78 43 100 55 100 81 78 94 56 81Z M56 55 78 68 100 55 M78 68V94"/>
  </g>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="118" y="80" font-size="38" font-weight="700" fill="#f0f7f3">CCBOX</text>
    <text x="56" y="154" font-size="34" font-weight="600" fill="#f0f7f3">选好账号和项目，开始开发。</text>
    <text x="56" y="193" font-size="18" fill="#b0c4ba">Claude Code 的图形化工作区 · 第一次配置，之后复用</text>
    <rect x="56" y="231" width="132" height="34" rx="17" fill="#213b2d"/>
    <text x="122" y="254" text-anchor="middle" font-size="14" fill="#c5f6dc">Windows x64</text>
    <rect x="200" y="231" width="188" height="34" rx="17" fill="#213b2d"/>
    <text x="294" y="254" text-anchor="middle" font-size="14" fill="#c5f6dc">Mac · Apple Silicon</text>
    <text x="56" y="326" font-size="15" fill="#9bb6a8">沙箱开发为默认选项 · 需要时再启用本机工具链</text>
    <rect x="755" y="51" width="467" height="78" rx="14" fill="#182722" stroke="#345144"/>
    <text x="781" y="100" font-size="25" fill="#b7f1d3">01</text>
    <text x="837" y="86" font-size="20" font-weight="600" fill="#f0f7f3">选择独立空间</text>
    <text x="837" y="111" font-size="14" fill="#b0c4ba">各自保存代理、登录与编辑器资料</text>
    <path d="M988 133V148 M982 143 988 149 994 143" fill="none" stroke="#7b9e8c" stroke-width="2"/>
    <rect x="755" y="156" width="467" height="78" rx="14" fill="#182722" stroke="#345144"/>
    <text x="781" y="205" font-size="25" fill="#b7f1d3">02</text>
    <text x="837" y="191" font-size="20" font-weight="600" fill="#f0f7f3">选择项目文件</text>
    <text x="837" y="216" font-size="14" fill="#b0c4ba">主项目与附加文件夹，一起管理</text>
    <path d="M988 238V253 M982 248 988 254 994 248" fill="none" stroke="#7b9e8c" stroke-width="2"/>
    <rect x="755" y="261" width="467" height="68" rx="14" fill="#b7f1d3"/>
    <text x="781" y="305" font-size="25" fill="#143024">03</text>
    <text x="837" y="303" font-size="20" font-weight="600" fill="#143024">打开 / 恢复 VS Code →</text>
  </g>
</svg>
